name: ESP-IDF Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays at 04:17 UTC

permissions:
  contents: read

jobs:
  build-matrix:
    name: Select build coverage
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select matrix
        id: matrix
        run: |
          matrix="$(python3 .github/ci/build_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.idf_target }} (IDF ${{ matrix.idf_ver }}, ${{ matrix.framebuffer }})
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Configure framebuffer variant
        if: matrix.framebuffer != 'default'
        env:
          FRAMEBUFFER: ${{ matrix.framebuffer }}
          IDF_VERSION: ${{ matrix.idf_ver }}
          IDF_TARGET: ${{ matrix.idf_target }}
        run: |
          cat ".github/ci/sdkconfig.${FRAMEBUFFER}" >> sdkconfig.defaults
          if [ "$IDF_TARGET" = "esp32s3" ]; then
            echo 'CONFIG_HUB75_EXTERNAL_FRAMEBUFFERS=y' >> sdkconfig.defaults
            echo 'CONFIG_SPIRAM_MODE_OCT=y' >> sdkconfig.defaults
            echo 'CONFIG_SPIRAM_SPEED_80M=y' >> sdkconfig.defaults
          else
            echo 'CONFIG_SPIRAM_SPEED_200M=y' >> sdkconfig.defaults
          fi
          if [ "$IDF_VERSION" = "v4.4.8" ]; then
            echo 'CONFIG_ESP32S3_SPIRAM_SUPPORT=y' >> sdkconfig.defaults
          fi

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: ${{ matrix.idf_ver }}
          target: ${{ matrix.idf_target }}
          path: '.'

      - name: Verify framebuffer configuration
        if: matrix.framebuffer != 'default'
        env:
          FRAMEBUFFER: ${{ matrix.framebuffer }}
        run: |
          grep -q '^#define CONFIG_SPIRAM 1$' build/config/sdkconfig.h
          grep -q '^#define CONFIG_HUB75_KCONFIG_PRESENT 1$' build/config/sdkconfig.h
          if [ "$FRAMEBUFFER" = "psram" ]; then
            grep -q '^#define CONFIG_HUB75_EXTERNAL_FRAMEBUFFERS 1$' build/config/sdkconfig.h
          else
            ! grep -q '^#define CONFIG_HUB75_EXTERNAL_FRAMEBUFFERS ' build/config/sdkconfig.h
          fi

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-matrix, build]
    if: always()
    steps:
      - name: Check build results
        env:
          MATRIX_RESULT: ${{ needs.build-matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$BUILD_RESULT" = success
