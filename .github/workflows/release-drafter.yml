name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# One run at a time, so a queued run sees the previous run's version-bump commit.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release-drafter:
    name: Release Drafter
    # Holds DEPLOY_KEY, which the branch ruleset allows to push to main.
    environment: release-drafter
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: drafter

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Update version files
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          sed -i "s/\"version\": .*/\"version\": \"${VERSION}\",/g" library.json
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml

      - name: Regenerate lockfile
        run: uv lock

      - name: Commit changes
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        run: |
          paths=(library.json pyproject.toml uv.lock)
          if ! git diff --quiet -- "${paths[@]}"; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "Bump version to ${VERSION} [skip ci]"
            git push
          fi
