name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# One run at a time, so a queued run sees the previous run's version-bump commit.
concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  release-drafter:
    name: Release Drafter
    # Holds DEPLOY_KEY, which the branch ruleset allows to push to main.
    environment: release-drafter
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        id: drafter

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Bump version
        env:
          VERSION: ${{ steps.drafter.outputs.resolved_version }}
        # Runs only when the resolved version is higher than library.json's, so a
        # manual bump ahead of the draft is never rolled back.
        run: |
          current=$(jq -r .version library.json)
          if [ "$current" = "$VERSION" ] \
             || [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" = "$current" ]; then
            echo "library.json is at $current; resolved $VERSION is not higher, not bumping."
            exit 0
          fi
          jq --arg v "$VERSION" '.version = $v' library.json > library.json.tmp
          mv library.json.tmp library.json
          uv version --no-sync "$VERSION"
          git add library.json pyproject.toml uv.lock
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Bump version to $VERSION [skip ci]"
            git push
          fi
